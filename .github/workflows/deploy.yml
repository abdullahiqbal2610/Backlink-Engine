name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: gaper-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Add permissions for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Authenticate to GCP (Make sure to configure Workload Identity Federation or Service Account JSON)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Authorize Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Prepare Env Vars
      run: |
        echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
        python3 -c "
        vars = []
        with open('.env') as f:
            for line in f:
                line = line.strip()
                if line and not line.startswith('#') and '=' in line:
                    vars.append(line)
        # Use @ as delimiter to safely handle commas in DEVTO_API_KEY
        print('^@^' + '@'.join(vars))
        " > env_args.txt

    # Dashboard Build & Deploy
    - name: Build and Push Dashboard
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dashboard:latest -f infra/Dockerfile.dashboard .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dashboard:latest

    - name: Deploy Dashboard to Cloud Run
      run: |
        ENV_ARGS=$(cat env_args.txt)
        gcloud run deploy abdul-dashboard \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/dashboard:latest \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --timeout=300 \
          --cpu=1 \
          --memory=512Mi \
          --set-env-vars "$ENV_ARGS"

    # Worker Build & Push
    - name: Build and Push Worker (LLM/Discovery)
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/worker:latest -f infra/Dockerfile.worker .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/worker:latest

    # Router Build & Push
    - name: Build and Push Router
      run: |
        docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/router:latest -f infra/Dockerfile.playwright .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/router:latest

    - name: Deploy LLM Worker to Cloud Run
      run: |
        ENV_ARGS=$(cat env_args.txt)
        gcloud run jobs update abdul-llm-job \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/worker:latest \
          --region ${{ env.REGION }} \
          --update-env-vars "$ENV_ARGS"

    - name: Update Router Job
      run: |
        ENV_ARGS=$(cat env_args.txt)
        gcloud run jobs update abdul-router-job \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/router:latest \
          --region ${{ env.REGION }} \
          --update-env-vars "$ENV_ARGS"
