name: POC - CI/CD Pipeline with Quality Gate

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Run Tests (The Gate)
        run: |
          pip install pytest
          pytest -q
          # If this step fails, the entire pipeline stops here and deploy won't run.

  deploy:
    needs: test # This enforces the gate: deploy only runs if test passes
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud Run
        run: echo "Deploying to production..."
