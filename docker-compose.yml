version: '3.8'


services:
  redis:
    image: redis:7-alpine
    container_name: backlink_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backlink_net

  discovery_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: backlink_discovery
    restart: always
    depends_on:
      - redis
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - backlink_net

  llm_worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    container_name: backlink_llm
    restart: always
    command: ["python", "llm_pipeline/worker.py"]
    depends_on:
      - redis
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - backlink_net

  execution_router:
    build:
      context: .
      dockerfile: infra/Dockerfile.playwright
    container_name: backlink_router
    restart: always
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - browser_profiles:/app/browser_profiles
    networks:
      - backlink_net

  dashboard:
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
    container_name: backlink_dashboard
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - browser_profiles:/app/browser_profiles
    networks:
      - backlink_net

volumes:
  redis_data:
  browser_profiles:

networks:
  backlink_net:
    driver: bridge
