version: '3.8'

services:
  db:
    image: postgres:15
    container_name: backlink_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backlink_engine}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backlink_net

  redis:
    image: redis:7-alpine
    container_name: backlink_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backlink_net

volumes:
  postgres_data:
  redis_data:

networks:
  backlink_net:
    driver: bridge
